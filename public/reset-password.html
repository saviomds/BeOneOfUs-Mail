<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Choose a new BeOneOfUs Mail password.">
    <link rel="icon" type="image/png" href="./Logo/logo.png">
    <title>Choose a new password - BeOneOfUs Mail</title>
    <link rel="stylesheet" href="./css/style.css">
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <a class="auth-brand" href="/">
        <img src="./Logo/Glossy B1 Mail Orbit Logo.png" alt="">
        <span>BeOneOfUs <strong>Mail</strong></span>
      </a>
      <section class="auth-card" aria-labelledby="auth-title">
        <div class="auth-heading">
          <span class="auth-mark" aria-hidden="true"><img src="./Logo/logo.png" alt=""></span>
          <p class="auth-eyebrow">ALMOST BACK IN</p>
          <h1 id="auth-title">Choose a new password</h1>
          <p>Reset links are one-time use and expire after 30 minutes.</p>
        </div>
        <form class="auth-form" data-reset-password-form>
          <div class="auth-field">
            <label for="new-password">New password</label>
            <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
          </div>
          <p class="profile-status" data-reset-password-status role="status" aria-live="polite"></p>
          <button class="auth-submit" type="submit">Reset password <span aria-hidden="true">&rarr;</span></button>
        </form>
        <p class="auth-switch"><a class="auth-back-link" href="/login">Back to sign in</a></p>
      </section>
      <p class="auth-footer"><a href="/">Back to BeOneOfUs Mail</a></p>
    </main>
    <script type="module" src="./js/password-reset.js"></script>
  </body>
</html>
