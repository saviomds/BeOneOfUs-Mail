<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Reset your BeOneOfUs Mail password.">
    <link rel="icon" type="image/png" href="./Logo/logo.png">
    <title>Reset password - BeOneOfUs Mail</title>
    <link rel="stylesheet" href="./css/style.css">
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <a class="auth-brand" href="/">
        <img src="./Logo/Glossy B1 Mail Orbit Logo.png" alt="">
        <span>BeOneOfUs <strong>Mail</strong></span>
      </a>
      <section class="auth-card" aria-labelledby="auth-title">
        <div class="auth-heading">
          <span class="auth-mark" aria-hidden="true"><img src="./Logo/logo.png" alt=""></span>
          <p class="auth-eyebrow">LET'S GET YOU BACK IN</p>
          <h1 id="auth-title">Reset your password</h1>
          <p>Enter the email address linked to your account and we'll help you get back in.</p>
        </div>
        <form class="auth-form" data-reset-request-form>
          <div class="auth-field">
            <label for="reset-email">Email address</label>
            <input id="reset-email" name="email" type="email" autocomplete="email" placeholder="you@beoneofus.com" pattern="^[^@\s]+@beoneofus\.com$" title="Use your @beoneofus.com company address." required>
          </div>
          <p class="profile-status" data-reset-request-status role="status" aria-live="polite"></p>
          <button class="auth-submit" type="submit">Send reset link <span aria-hidden="true">&rarr;</span></button>
        </form>
        <p class="auth-switch"><a class="auth-back-link" href="/login"><span aria-hidden="true">&larr;</span> Back to sign in</a></p>
      </section>
      <p class="auth-footer"><a href="/">Back to BeOneOfUs Mail</a></p>
    </main>
    <script type="module" src="./js/password-reset.js"></script>
  </body>
</html>
